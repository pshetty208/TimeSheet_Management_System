<header class="app-header" *ngIf="auth.isAuthenticated()">
  <a class="brand" routerLink="/timesheets" aria-label="Timesheet home">
    <span class="brand-mark" aria-hidden="true">T</span>
    <span><strong>{{ language.t('app') }}</strong><small>{{ language.t('workSimple') }}</small></span>
  </a>
  <nav aria-label="Primary navigation">
    <a routerLink="/timesheets" routerLinkActive="active">{{ language.t('timesheets') }}</a>
    <a routerLink="/contracts" routerLinkActive="active">{{ language.t('contracts') }}</a>
  </nav>
  <div class="header-actions">
    <button class="utility-button" (click)="language.toggle()" aria-label="Change language">{{ language.t('language') }}</button>
    <button class="logout-button" (click)="logout()">{{ language.t('logout') }}</button>
  </div>
</header>
<main><router-outlet></router-outlet></main>
