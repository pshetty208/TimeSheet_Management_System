spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tss}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:tss_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:tss_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
jwt.secret=${JWT_SECRET:localdevelopmentsecretlocaldevelopmentsecret}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
tss.seed.enabled=${TSS_SEED_ENABLED:true}
tss.seed.admin.username=${TSS_ADMIN_USERNAME:admin}
tss.seed.admin.password=${TSS_ADMIN_PASSWORD:password123}
tss.holidays.state=${TSS_HOLIDAY_STATE:RP}
